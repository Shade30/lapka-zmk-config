### General
# CONFIG_ZMK_USB_LOGGING=y

### Board name
CONFIG_ZMK_KEYBOARD_NAME="Lapka"

### Power
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Enable power management
CONFIG_PM_DEVICE=y

# Enable Bluetooth Battery Service
CONFIG_BT_BAS=y

### Battery settings
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_BATTERY_REPORTING=y

### Make Bluetooth stronger
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

### BLE Stability Improvements
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

### Bluetooth settings
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# There are no LED's and OLED's so turn off external power
CONFIG_ZMK_EXT_POWER=n
